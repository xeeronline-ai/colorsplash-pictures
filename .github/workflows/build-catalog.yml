name: Prepare pictures

# Runs whenever a picture is uploaded, replaced or deleted.
on:
  push:
    branches: [main]
    paths: ['pictures/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.3.0
      - name: Convert pictures and update catalog.json
        id: build
        run: python3 tools/build_catalog.py
        continue-on-error: true
      - name: Save the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Prepare pictures and update catalog.json"
            git pull --rebase
            git push
          fi
      - name: Report skipped files
        if: steps.build.outcome == 'failure'
        run: |
          echo "Some files were skipped. Open the 'Convert pictures' step above to see why."
          exit 1
